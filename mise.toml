[tools]
xcodegen = "2.46.0"
swiftlint = "0.65.0"
lefthook = "2.1.10"
semgrep = "1.172.0"

[tasks.generate]
depends = ["knowledge"]
run = "xcodegen generate"

[tasks.fmt]
run = "xcrun swift-format format --in-place --recursive App Core"

[tasks.lint]
wait_for = ["fmt"]
run = [
  "xcrun swift-format lint --strict --recursive App Core",
  "swiftlint lint --strict --quiet",
]

[tasks."test-macos"]
run = "swift test --package-path Core/CroftCore"

[tasks."test-ios"]
dir = "Core/CroftCore"
run = "xcodebuild test -scheme CroftCore-Package -destination 'platform=iOS Simulator,name=iPhone 17' -quiet"

[tasks."test-ui"]
depends = ["generate"]
run = "xcodebuild test -project Croft.xcodeproj -scheme Croft-iOS -destination 'platform=iOS Simulator,name=iPhone 17' -quiet"

[tasks.test]
wait_for = ["fmt"]
run = ["mise run test-macos"]

[tasks."test-all"]
run = [
  "mise run test-macos",
  "mise run test-ios",
  "mise run test-ui",
]

[tasks.pin]
run = "swift run --package-path Core/CroftCore -c release knowledge-importer pin knowledge/inputs"

[tasks.knowledge]
wait_for = ["fmt"]
run = [
  "swift run --package-path Core/CroftCore -c release knowledge-importer build knowledge/inputs App/Shared/Resources/PlantImages App/Shared/Resources/knowledge.sqlite",
  "swift run --package-path Core/CroftCore -c release knowledge-importer attribution App/Shared/Resources/knowledge.sqlite knowledge/ATTRIBUTION.md",
]

[tasks."test-runtime-tokens"]
depends = ["generate"]
wait_for = ["build", "check"]
run = "xcodebuild test -project Croft.xcodeproj -scheme Croft-macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet"

[tasks.build]
depends = ["generate"]
wait_for = ["check-fast"]
run = [
  "xcodebuild build -project Croft.xcodeproj -scheme Croft-macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet",
]

[tasks."build-ios"]
depends = ["generate"]
run = [
  "xcodebuild build -project Croft.xcodeproj -scheme Croft-iOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet",
]

[tasks."check-fast"]
depends = ["fmt", "lint", "test"]

[tasks.check]
depends = ["check-fast", "build"]

[tasks.ci]
depends = ["check", "test-runtime-tokens"]

[tasks."changelog-draft"]
run = '''
set -euo pipefail
last=$(git tag -l 'v[0-9]*' '[0-9]*' --sort=-v:refname | head -1)
if [ -n "$last" ]; then range="$last..HEAD"; else range=HEAD; fi
echo "## Draft changelog ($range)"
for group in feat fix docs chore refactor test ci; do
  lines=$(git log --no-merges --format='%s' "$range" | grep -E "^$group(\(|:|!)" || true)
  if [ -n "$lines" ]; then
    echo
    echo "### $group"
    echo "$lines" | sed -E "s/^$group(\([^)]*\))?!?: /- /"
  fi
done
other=$(git log --no-merges --format='%s' "$range" | grep -vE '^(feat|fix|docs|chore|refactor|test|ci)(\(|:|!)' || true)
if [ -n "$other" ]; then
  echo
  echo "### other"
  echo "$other" | sed 's/^/- /'
fi
'''

[tasks.security]
run = "semgrep scan --config auto --error"
