[tools]
xcodegen = "2.46.0"
swiftlint = "0.65.0"
jq = "1.8.1"
lefthook = "2.1.10"
semgrep = "1.172.0"

[tasks.generate]
depends = ["knowledge"]
run = "xcodegen generate"

[tasks.fmt]
run = "xcrun swift-format format --in-place --recursive App Core"

[tasks.lint]
wait_for = ["fmt"]
run = [
  "xcrun swift-format lint --strict --recursive App Core",
  "swiftlint lint --strict --quiet",
]

[tasks."test-macos"]
run = "swift test --package-path Core/CroftCore"

[tasks."test-ios"]
dir = "Core/CroftCore"
run = "xcodebuild test -scheme CroftCore-Package -destination 'platform=iOS Simulator,name=iPhone 17' -quiet"

[tasks."test-ui"]
depends = ["generate"]
run = "xcodebuild test -project Croft.xcodeproj -scheme Croft-iOS -destination 'platform=iOS Simulator,name=iPhone 17' -quiet"

[tasks.test]
wait_for = ["fmt"]
run = ["mise run test-macos"]

[tasks."test-all"]
run = [
  "mise run test-macos",
  "mise run test-ios",
  "mise run test-ui",
]

[tasks.pin]
run = "swift run --package-path Core/CroftCore -c release knowledge-importer pin knowledge/inputs"

[tasks.knowledge]
wait_for = ["fmt"]
run = [
  "swift run --package-path Core/CroftCore -c release knowledge-importer build knowledge/inputs App/Shared/Resources/PlantImages App/Shared/Resources/knowledge.sqlite",
  "swift run --package-path Core/CroftCore -c release knowledge-importer attribution App/Shared/Resources/knowledge.sqlite knowledge/ATTRIBUTION.md",
]

[tasks."test-runtime-tokens"]
depends = ["generate"]
wait_for = ["build", "check"]
run = "xcodebuild test -project Croft.xcodeproj -scheme Croft-macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet"

[tasks.build]
depends = ["generate"]
wait_for = ["check-fast"]
run = [
  "xcodebuild build -project Croft.xcodeproj -scheme Croft-macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet",
]

[tasks."build-ios"]
depends = ["generate"]
run = [
  "xcodebuild build -project Croft.xcodeproj -scheme Croft-iOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet",
]

[tasks."check-fast"]
depends = ["fmt", "lint", "test"]

[tasks.check]
depends = ["check-fast", "build"]

[tasks."check-resolved"]
wait_for = ["build", "test-runtime-tokens", "test", "knowledge"]
run = '''
set -euo pipefail
if ! git diff --exit-code HEAD -- Core/CroftCore/Package.resolved; then
  echo "Core/CroftCore/Package.resolved drifted from HEAD. A resolver rewrote it; discard the churn, do not commit it." >&2
  exit 1
fi
ws="Croft.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
if [ -f "$ws" ] && ! cmp -s project.resolved "$ws"; then
  echo "project.resolved no longer matches the generated workspace pins at $ws; the build re-resolved the project graph. Run mise run refresh-resolved and commit project.resolved." >&2
  exit 1
fi
core_grdb=$(jq -r '[.pins[] | select(.identity == "grdb.swift")] | if length == 1 then (.[0].state.revision // "") else "" end' Core/CroftCore/Package.resolved)
project_grdb=$(jq -r '[.pins[] | select(.identity == "grdb.swift")] | if length == 1 then (.[0].state.revision // "") else "" end' project.resolved)
if [ -z "$core_grdb" ] || [ -z "$project_grdb" ]; then
  echo "Could not extract exactly one GRDB pin from Core/CroftCore/Package.resolved and project.resolved; a pin is missing or the lockfile format changed." >&2
  exit 1
fi
if [ "$core_grdb" != "$project_grdb" ]; then
  echo "GRDB pins disagree: Core/CroftCore/Package.resolved has $core_grdb, project.resolved has $project_grdb. Run mise run refresh-resolved and commit project.resolved." >&2
  exit 1
fi
sparkle_yml=$(awk '/^  Sparkle:$/{f=1; next} f && /^ {0,2}[^ ]/{f=0} f && $1 == "exactVersion:"{print $2; exit}' project.yml)
sparkle_resolved=$(jq -r '[.pins[] | select(.identity == "sparkle")] | if length == 1 then (.[0].state.version // "") else "" end' project.resolved)
if [ -z "$sparkle_yml" ] || [ -z "$sparkle_resolved" ]; then
  echo "Could not extract the Sparkle version from project.yml and project.resolved; the pin is missing or the format changed." >&2
  exit 1
fi
if [ "$sparkle_yml" != "$sparkle_resolved" ]; then
  echo "Sparkle pins disagree: project.yml wants $sparkle_yml, project.resolved has $sparkle_resolved. Run mise run refresh-resolved and commit project.resolved." >&2
  exit 1
fi
'''

[tasks."refresh-resolved"]
run = '''
set -euo pipefail
xcodegen generate
rm -f Croft.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
keep=$(mktemp)
cp Core/CroftCore/Package.resolved "$keep"
trap 'if [ -f "$keep" ]; then cp "$keep" Core/CroftCore/Package.resolved; rm -f "$keep"; fi' EXIT INT TERM
xcodebuild -resolvePackageDependencies -project Croft.xcodeproj -scheme Croft-macOS -quiet
cp Core/CroftCore/Package.resolved project.resolved
mkdir -p Croft.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
cp project.resolved Croft.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
'''

[tasks.ci]
depends = ["check", "test-runtime-tokens", "check-resolved"]

[tasks."changelog-draft"]
run = '''
set -euo pipefail
last=$(git tag -l 'v[0-9]*' '[0-9]*' --sort=-v:refname | head -1)
if [ -n "$last" ]; then range="$last..HEAD"; else range=HEAD; fi
echo "## Draft changelog ($range)"
for group in feat fix docs chore refactor test ci; do
  lines=$(git log --no-merges --format='%s' "$range" | grep -E "^$group(\(|:|!)" || true)
  if [ -n "$lines" ]; then
    echo
    echo "### $group"
    echo "$lines" | sed -E "s/^$group(\([^)]*\))?!?: /- /"
  fi
done
other=$(git log --no-merges --format='%s' "$range" | grep -vE '^(feat|fix|docs|chore|refactor|test|ci)(\(|:|!)' || true)
if [ -n "$other" ]; then
  echo
  echo "### other"
  echo "$other" | sed 's/^/- /'
fi
'''

[tasks.security]
run = "semgrep scan --config auto --error"
