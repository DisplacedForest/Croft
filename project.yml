name: Croft
options:
  bundleIdPrefix: com.displacedforest
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  CroftCore:
    path: Core/CroftCore
targets:
  Croft-macOS:
    type: application
    platform: macOS
    sources:
      - App/Shared
      - App/macOS
      - path: App/Shared/Resources
        buildPhase: resources
        optional: true
        createIntermediateGroups: true
    dependencies:
      - package: CroftCore
        products:
          - Domain
          - Persistence
          - Graph
          - Knowledge
          - GardenModel
          - Design
          - PlantCatalog
          - Today
          - Capture
    settings:
      base:
        PRODUCT_NAME: Croft
        PRODUCT_BUNDLE_IDENTIFIER: com.displacedforest.croft
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App/macOS/Croft.entitlements
        INFOPLIST_KEY_NSLocationUsageDescription: Croft shows the weather for where your garden grows.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Croft shows the weather for where your garden grows.
    postBuildScripts:
      - name: Guard bundled knowledge snapshot
        shell: /bin/bash
        script: |
          if [ ! -f "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/knowledge.sqlite" ]; then
            echo "error: app bundle is missing knowledge.sqlite; run mise run build so the snapshot exists before project generation" >&2
            exit 1
          fi
        basedOnDependencyAnalysis: false
  Croft-iOS:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/iOS
      - path: App/Shared/Resources
        buildPhase: resources
        optional: true
        createIntermediateGroups: true
    dependencies:
      - package: CroftCore
        products:
          - Domain
          - Persistence
          - Graph
          - Knowledge
          - GardenModel
          - Design
          - PlantCatalog
          - Today
          - Capture
    settings:
      base:
        PRODUCT_NAME: Croft
        PRODUCT_BUNDLE_IDENTIFIER: com.displacedforest.croft
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Croft shows the weather for where your garden grows.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  DesignRuntimeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/DesignRuntimeTests
    dependencies:
      - package: CroftCore
        products:
          - Design
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    postBuildScripts:
      - name: Guard bundled knowledge snapshot
        shell: /bin/bash
        script: |
          if [ ! -f "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/knowledge.sqlite" ]; then
            echo "error: app bundle is missing knowledge.sqlite; run mise run build so the snapshot exists before project generation" >&2
            exit 1
          fi
        basedOnDependencyAnalysis: false
  Croft-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: Croft-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Croft-macOS:
    build:
      targets:
        Croft-macOS: all
    run:
      config: Debug
    test:
      targets:
        - DesignRuntimeTests
  Croft-iOS:
    build:
      targets:
        Croft-iOS: all
    run:
      config: Debug
    test:
      targets:
        - Croft-iOS-UITests
