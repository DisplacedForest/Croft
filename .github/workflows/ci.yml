name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect docs-only change
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            git fetch --no-tags --deepen=1 origin
            changed=$(git diff --name-only HEAD~1 HEAD)
          fi
          echo "$changed"
          if [ -n "$changed" ] && echo "$changed" | grep -qvE '(^docs/|^LICENSE$|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        if: steps.diff.outputs.code == 'true'
        with:
          install_args: xcodegen swiftlint jq
      - name: Pin Xcode
        if: steps.diff.outputs.code == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app || { ls /Applications | grep -i xcode; exit 1; }
          xcodebuild -version
      - name: Cache SwiftPM build
        if: steps.diff.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            Core/CroftCore/.build
            ~/Library/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode-26.6-${{ hashFiles('Core/CroftCore/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-xcode-26.6-${{ hashFiles('Core/CroftCore/Package.resolved') }}-
            spm-${{ runner.os }}-xcode-26.6-
      - name: Cache DerivedData
        if: steps.diff.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-xcode-26.6-${{ hashFiles('Core/CroftCore/Package.resolved', 'project.yml') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ runner.os }}-xcode-26.6-${{ hashFiles('Core/CroftCore/Package.resolved', 'project.yml') }}-
            deriveddata-${{ runner.os }}-xcode-26.6-
      - name: Verify
        if: steps.diff.outputs.code == 'true'
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run ci
      - name: Package.resolved unchanged
        if: steps.diff.outputs.code == 'true'
        run: |
          git diff --exit-code HEAD -- Core/CroftCore/Package.resolved
          cmp project.resolved Croft.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
