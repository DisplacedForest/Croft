name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        with:
          install: false
      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app || { ls /Applications | grep -i xcode; exit 1; }
          xcodebuild -version
      - name: Install tools
        run: mise install xcodegen swiftlint
      - name: Ensure simulator
        run: xcrun simctl list devices available | grep -q "iPhone 17 (" || xcrun simctl create "iPhone 17" "iPhone 17"
      - name: Verify
        run: mise run ci
