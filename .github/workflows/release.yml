name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version for the rehearsal build"
        required: false
        default: "0.0.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release
    if: github.repository == 'DisplacedForest/Croft'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Define signing material paths
        run: |
          set -euo pipefail
          {
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/release-signing.keychain-db"
            echo "API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8"
            echo "PROFILE_STAGING=$RUNNER_TEMP/croft-developer-id.provisionprofile"
          } >> "$GITHUB_ENV"

      - name: Check required secrets
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=""
          for name in MACOS_SIGNING_CERT_P12_BASE64 MACOS_SIGNING_CERT_PASSWORD MACOS_PROVISIONING_PROFILE_BASE64 APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_TEAM_ID SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "See docs/release.md for how to create and add them." >&2
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          install_args: xcodegen

      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app || { ls /Applications | grep -i xcode; exit 1; }
          xcodebuild -version

      - name: Import signing certificate into temporary keychain
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          cert_path="$RUNNER_TEMP/signing-cert.p12"
          echo -n "$MACOS_SIGNING_CERT_P12_BASE64" | base64 --decode > "$cert_path"
          security import "$cert_path" -k "$KEYCHAIN_PATH" -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        id: profile
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo -n "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_STAGING"
          plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_STAGING" > "$plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
          rm -f "$plist"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE_STAGING" "$dir/$profile_uuid.provisionprofile"
          done
          echo "uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          expected_name="$(sed -n 's/^ *PROVISIONING_PROFILE_SPECIFIER: //p' project.yml)"
          if [ "$profile_name" != "$expected_name" ]; then
            echo "Provisioning profile is named '$profile_name' but project.yml expects '$expected_name'." >&2
            echo "Rename the profile or update PROVISIONING_PROFILE_SPECIFIER in project.yml." >&2
            exit 1
          fi
          echo "name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "Installed profile $profile_name ($profile_uuid)"

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            Core/CroftCore/.build
            ~/Library/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode-26.6-${{ hashFiles('Core/CroftCore/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-xcode-26.6-${{ hashFiles('Core/CroftCore/Package.resolved') }}-
            spm-${{ runner.os }}-xcode-26.6-

      - name: Generate project
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run generate

      - name: Archive signed release build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Croft.xcodeproj \
            -scheme Croft-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Croft.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -quiet

      - name: Re-sign Sparkle components with the release identity
        run: |
          set -euo pipefail
          app="build/Croft.xcarchive/Products/Applications/Croft.app"
          framework="$app/Contents/Frameworks/Sparkle.framework"
          identity="Developer ID Application"
          codesign --force --options runtime --timestamp \
            --preserve-metadata=entitlements --sign "$identity" \
            "$framework/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --options runtime --timestamp --sign "$identity" \
            "$framework/Versions/B/XPCServices/Installer.xpc"
          codesign --force --options runtime --timestamp --sign "$identity" \
            "$framework/Versions/B/Autoupdate"
          codesign --force --options runtime --timestamp --sign "$identity" \
            "$framework/Versions/B/Updater.app"
          codesign --force --options runtime --timestamp --sign "$identity" "$framework"
          codesign --force --options runtime --timestamp \
            --preserve-metadata=entitlements --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Notarize and staple
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="build/Croft.xcarchive/Products/Applications/Croft.app"
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"
          submission_zip="$RUNNER_TEMP/Croft-notarization.zip"
          ditto -c -k --keepParent "$app" "$submission_zip"
          result="$(xcrun notarytool submit "$submission_zip" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json)"
          echo "$result"
          submission_id="$(echo "$result" | jq -r .id)"
          status="$(echo "$result" | jq -r .status)"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$submission_id" \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" || true
            echo "Notarization failed with status: $status" >&2
            exit 1
          fi
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

      - name: Verify signature and Gatekeeper assessment
        run: |
          set -euo pipefail
          app="build/Croft.xcarchive/Products/Applications/Croft.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Package dmg
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app="build/Croft.xcarchive/Products/Applications/Croft.app"
          staging="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$staging"
          ditto "$app" "$staging/Croft.app"
          ln -s /Applications "$staging/Applications"
          dmg_path="build/Croft-$VERSION.dmg"
          hdiutil create -volname "Croft $VERSION" -srcfolder "$staging" -ov -format UDZO "$dmg_path"
          codesign --sign "Developer ID Application" --timestamp "$dmg_path"
          echo "dmg=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          DMG_PATH: ${{ steps.package.outputs.dmg }}
        run: |
          set -euo pipefail
          result="$(xcrun notarytool submit "$DMG_PATH" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json)"
          echo "$result"
          submission_id="$(echo "$result" | jq -r .id)"
          status="$(echo "$result" | jq -r .status)"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$submission_id" \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" || true
            echo "dmg notarization failed with status: $status" >&2
            exit 1
          fi
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Verify dmg assessment
        env:
          DMG_PATH: ${{ steps.package.outputs.dmg }}
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"
          shasum -a 256 "$DMG_PATH"

      - name: Sign update with the Sparkle key and write the appcast
        id: appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DMG_PATH: ${{ steps.package.outputs.dmg }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sparkle_version="2.9.6"
          sparkle_sha256="52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192"
          archive="$RUNNER_TEMP/Sparkle-dist.tar.xz"
          curl -sSfL -o "$archive" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz"
          echo "$sparkle_sha256  $archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle-dist"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle-dist"
          signature="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" \
            | "$RUNNER_TEMP/sparkle-dist/bin/sign_update" --ed-key-file - "$DMG_PATH")"
          case "$signature" in
            *sparkle:edSignature=*) ;;
            *) echo "sign_update produced unexpected output" >&2; exit 1 ;;
          esac
          published="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          dmg_url="https://github.com/DisplacedForest/Croft/releases/download/v$VERSION/Croft-$VERSION.dmg"
          cat > build/appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Croft</title>
              <item>
                <title>Croft $VERSION</title>
                <pubDate>$published</pubDate>
                <sparkle:version>$GITHUB_RUN_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <link>https://github.com/DisplacedForest/Croft/releases/tag/v$VERSION</link>
                <enclosure url="$dmg_url" $signature type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          APPCAST
          echo "appcast=build/appcast.xml" >> "$GITHUB_OUTPUT"
          cat build/appcast.xml

      - name: Attach to GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PATH: ${{ steps.package.outputs.dmg }}
          APPCAST_PATH: ${{ steps.appcast.outputs.appcast }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          fi
          gh release upload "$tag" "$DMG_PATH" "$APPCAST_PATH" --clobber

      - name: Upload rehearsal artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Croft-${{ steps.version.outputs.version }}-dmg
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.appcast.outputs.appcast }}
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        env:
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$API_KEY_PATH" "$PROFILE_STAGING" "$RUNNER_TEMP/signing-cert.p12" "$RUNNER_TEMP/profile.plist"
          if [ -n "$PROFILE_UUID" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.provisionprofile"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.provisionprofile"
          fi
